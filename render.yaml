services:
  - type: web
    name: reels-mwjz
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: VERIFY_TOKEN
        value: reels123
      - key: SERVER_URL
        value: https://reels-mwjz.onrender.com
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
